server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # miniserve runs natively (MPS); promtail just tails its log file
  - job_name: miniserve
    static_configs:
      - targets: [localhost]
        labels:
          job: miniserve
          __path__: /logs/*.log
