[project]
name = "miniserve"
version = "0.1.0"
description = "A tiny vLLM-style inference server with paged KV cache and continuous batching"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "fastapi>=0.162.0",
    "huggingface-hub>=2.3.0",
    "numpy>=2.5.4",
    "torch>=2.14.1",
    "transformers>=5.21.0",
    "uvicorn>=0.30.0",
    "uuid>=1.30",
]

[project.scripts]
miniserve = "miniserve.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.0", "textual>=1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
